<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rosemary Splash</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:transparent}
a{color:#8C6A22}a:hover{color:#5E4715}
.rs-stage{animation:rs-exit .8s cubic-bezier(.7,0,.84,0) 4.3s forwards}
.rs-cluster{position:relative;width:640px;height:250px;flex:none}
.rs-card{position:absolute;box-sizing:border-box;border-radius:14px;overflow:hidden;-webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);opacity:0;transform:translateY(26px) scale(.95);filter:blur(6px);animation:rs-card .9s cubic-bezier(.16,1,.3,1) forwards}
.rs-card::after{content:"";position:absolute;top:-20%;bottom:-20%;left:-60%;width:40%;background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.55),rgba(255,255,255,0));transform:skewX(-18deg);animation:rs-sheen 1.1s cubic-bezier(.45,0,.25,1) 1.55s forwards;pointer-events:none}
.c-main{animation-delay:.1s}.c-left{animation-delay:.3s}.c-right{animation-delay:.42s}.c-chip1{animation-delay:.62s}.c-chip2{animation-delay:.74s}
.rs-bar{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);animation:rs-grow .6s cubic-bezier(.16,1,.3,1) forwards}
.rs-draw{stroke-dasharray:100;stroke-dashoffset:100;animation:rs-draw 1s cubic-bezier(.65,0,.35,1) forwards}
.rs-area{opacity:0;animation:rs-fade .7s ease-out 1.25s forwards}
.rs-dot{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:rs-pop .45s cubic-bezier(.34,1.56,.64,1) 1.45s forwards}
.rs-arc1{stroke-dashoffset:62;animation:rs-draw .9s cubic-bezier(.65,0,.35,1) .75s forwards}
.rs-arc2{stroke-dashoffset:24;animation:rs-draw .5s cubic-bezier(.33,1,.68,1) 1.55s forwards}
.rs-pct{opacity:0;animation:rs-fade .4s ease-out 1.7s forwards}
.rs-particle{position:absolute;border-radius:50%;opacity:0;animation:rs-rise 2.2s ease-out forwards}
.rs-name{clip-path:inset(0 100% 0 0);transform:translateX(-14px);background-size:300% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:rs-wipe 1s cubic-bezier(.16,1,.3,1) 1.7s forwards,rs-shine 1.3s cubic-bezier(.45,0,.55,1) 2.85s forwards}
.rs-ch{display:inline-block;opacity:0;transform:translateY(10px);filter:blur(4px);animation:rs-ch .6s cubic-bezier(.16,1,.3,1) forwards}
.rs-line{transform:scaleX(0);animation:rs-scale .8s cubic-bezier(.65,0,.35,1) 2.45s forwards}
.rs-line-a{transform-origin:100% 50%}.rs-line-b{transform-origin:0 50%}
.rs-dia{opacity:0;transform:rotate(45deg) scale(0);animation:rs-dia .5s cubic-bezier(.34,1.56,.64,1) 2.4s forwards}
.rs-tag{opacity:0;transform:translateY(8px);animation:rs-up .8s cubic-bezier(.16,1,.3,1) 2.7s forwards}
.rs-beam{opacity:0;transform:translateX(-62vw) rotate(18deg);filter:blur(10px);animation:rs-beam 1.5s cubic-bezier(.45,0,.25,1) 2.7s forwards}
.rs-beam-2{filter:blur(3px);animation-delay:2.85s;animation-duration:1.35s}
.rs-spark{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(0);animation:rs-twinkle 1.1s ease-in-out forwards}
@keyframes rs-card{to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
@keyframes rs-sheen{to{left:130%}}
@keyframes rs-grow{to{transform:scaleY(1)}}
@keyframes rs-draw{to{stroke-dashoffset:0}}
@keyframes rs-fade{to{opacity:1}}
@keyframes rs-pop{to{transform:scale(1)}}
@keyframes rs-rise{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:.9}100%{opacity:0;transform:translateY(-90px) scale(1)}}
@keyframes rs-wipe{to{clip-path:inset(0 0 0 0);transform:translateX(0)}}
@keyframes rs-shine{from{background-position:100% 0}to{background-position:0 0}}
@keyframes rs-ch{to{opacity:1;transform:translateY(0);filter:blur(0)}}
@keyframes rs-scale{to{transform:scaleX(1)}}
@keyframes rs-dia{to{opacity:1;transform:rotate(45deg) scale(1)}}
@keyframes rs-up{to{opacity:1;transform:translateY(0)}}
@keyframes rs-beam{0%{opacity:0;transform:translateX(-62vw) rotate(18deg)}20%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translateX(62vw) rotate(18deg)}}
@keyframes rs-twinkle{0%{opacity:0;transform:scale(0) rotate(0deg)}45%{opacity:1;transform:scale(1) rotate(45deg)}100%{opacity:0;transform:scale(0) rotate(90deg)}}
@keyframes rs-exit{to{opacity:0;transform:translateY(-16px);filter:blur(6px)}}
@media (max-width: 700px){.rs-cluster{transform:scale(.56);margin:-55px 0}}
@media (prefers-reduced-motion: reduce){
.rs-stage *{animation-duration:.01s!important;animation-delay:0s!important}
.rs-beam,.rs-spark,.rs-particle,.rs-card::after{display:none}
}
</style>
</helmet>
<div style="position: relative; width: 100%; height: 100vh; min-height: 620px; overflow: hidden; background: {{backdrop}}; font-family: 'Inter', system-ui, sans-serif">
<sc-if value="{{show}}" hint-placeholder-val="{{ true }}">
<div class="rs-stage" style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; padding: 24px; box-sizing: border-box; text-align: center">
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; display: flex; align-items: center; justify-content: center">
<div class="rs-beam" style="position: absolute; width: 180px; height: 170%; background: {{beam}}"></div>
<div class="rs-beam rs-beam-2" style="position: absolute; width: 36px; height: 170%; margin-left: 150px; background: {{beam}}"></div>
</div>
<div class="rs-cluster" aria-hidden="true">
<div class="rs-card c-left" style="left: 0px; top: 62px; width: 180px; height: 132px; padding: 14px 16px; background: {{glassBg}}; border: 1px solid {{glassBorder}}; box-shadow: {{glassShadow}}; text-align: left">
<div style="font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: {{muted}}">Inventory</div>
<svg width="148" height="76" viewBox="0 0 148 76" style="display: block; margin-top: 12px">
<line x1="0" y1="75" x2="148" y2="75" stroke="{{gridLine}}" stroke-width="1"></line>
<rect class="rs-bar" style="animation-delay: .6s" x="4" y="40" width="14" height="35" rx="3" fill="{{green2}}"></rect>
<rect class="rs-bar" style="animation-delay: .68s" x="28" y="26" width="14" height="49" rx="3" fill="{{green2}}"></rect>
<rect class="rs-bar" style="animation-delay: .76s" x="52" y="48" width="14" height="27" rx="3" fill="{{green2}}"></rect>
<rect class="rs-bar" style="animation-delay: .84s" x="76" y="18" width="14" height="57" rx="3" fill="{{green1}}"></rect>
<rect class="rs-bar" style="animation-delay: .92s" x="100" y="30" width="14" height="45" rx="3" fill="{{green2}}"></rect>
<rect class="rs-bar" style="animation-delay: 1s" x="124" y="8" width="14" height="67" rx="3" fill="{{gold}}"></rect>
</svg>
</div>
<div class="rs-card c-main" style="left: 196px; top: 20px; width: 248px; height: 186px; padding: 16px 18px; background: {{glassBg}}; border: 1px solid {{glassBorder}}; box-shadow: {{glassShadow}}; text-align: left">
<div style="display: flex; justify-content: space-between; align-items: center">
<div style="font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: {{muted}}">Accounts</div>
<div style="display: flex; gap: 4px"><span style="width: 6px; height: 6px; border-radius: 3px; background: {{green1}}"></span><span style="width: 6px; height: 6px; border-radius: 3px; background: {{gold}}"></span></div>
</div>
<div style="margin-top: 8px; height: 8px; width: 92px; border-radius: 4px; background: {{skeleton}}"></div>
<svg width="212" height="112" viewBox="0 0 212 112" style="display: block; margin-top: 14px; overflow: visible">
<line x1="0" y1="28" x2="212" y2="28" stroke="{{gridLine}}" stroke-width="1"></line>
<line x1="0" y1="62" x2="212" y2="62" stroke="{{gridLine}}" stroke-width="1"></line>
<line x1="0" y1="96" x2="212" y2="96" stroke="{{gridLine}}" stroke-width="1"></line>
<path class="rs-area" d="M0 88 C 24 82, 36 70, 58 72 C 82 74, 92 52, 116 50 C 140 48, 150 60, 170 40 C 186 26, 198 22, 212 14 L 212 112 L 0 112 Z" fill="{{areaFill}}"></path>
<path class="rs-draw" style="animation-delay: .5s" pathLength="100" d="M0 88 C 24 82, 36 70, 58 72 C 82 74, 92 52, 116 50 C 140 48, 150 60, 170 40 C 186 26, 198 22, 212 14" fill="none" stroke="{{green1}}" stroke-width="2.5" stroke-linecap="round"></path>
<circle class="rs-dot" cx="212" cy="14" r="5" fill="{{gold}}" stroke="{{dotRing}}" stroke-width="2"></circle>
</svg>
</div>
<div class="rs-card c-right" style="left: 460px; top: 62px; width: 180px; height: 132px; padding: 14px 16px; background: {{glassBg}}; border: 1px solid {{glassBorder}}; box-shadow: {{glassShadow}}; text-align: left">
<div style="font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: {{muted}}">Payroll</div>
<div style="display: flex; align-items: center; gap: 14px; margin-top: 10px">
<svg width="78" height="78" viewBox="0 0 80 80">
<circle cx="40" cy="40" r="30" fill="none" stroke="{{gridLine}}" stroke-width="10"></circle>
<circle class="rs-arc1" cx="40" cy="40" r="30" fill="none" stroke="{{green1}}" stroke-width="10" pathLength="100" stroke-dasharray="62 100" transform="rotate(-90 40 40)"></circle>
<circle class="rs-arc2" cx="40" cy="40" r="30" fill="none" stroke="{{gold}}" stroke-width="10" pathLength="100" stroke-dasharray="24 100" transform="rotate(133.2 40 40)"></circle>
</svg>
<div class="rs-pct" style="display: flex; flex-direction: column; gap: 8px">
<div style="height: 7px; width: 46px; border-radius: 4px; background: {{green1}}"></div>
<div style="height: 7px; width: 32px; border-radius: 4px; background: {{gold}}"></div>
<div style="height: 7px; width: 40px; border-radius: 4px; background: {{skeleton}}"></div>
</div>
</div>
</div>
<div class="rs-card c-chip1" style="left: 40px; top: 4px; height: 44px; padding: 0 14px; display: flex; align-items: center; gap: 8px; border-radius: 22px; background: {{glassBg}}; border: 1px solid {{glassBorder}}; box-shadow: {{glassShadow}}">
<svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" fill="{{green1}}"></circle><path class="rs-draw" style="animation-delay: 1s; animation-duration: .5s" pathLength="100" d="M6 10.5 L9 13 L14.5 7.5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span style="font-size: 12px; font-weight: 600; color: {{ink}}">Attendance</span>
</div>
<div class="rs-card c-chip2" style="left: 452px; top: 206px; height: 44px; padding: 0 14px; display: flex; align-items: center; gap: 10px; border-radius: 22px; background: {{glassBg}}; border: 1px solid {{glassBorder}}; box-shadow: {{glassShadow}}">
<svg width="44" height="18" viewBox="0 0 44 18"><path class="rs-draw" style="animation-delay: 1.1s; animation-duration: .7s" pathLength="100" d="M1 14 L9 10 L16 12 L24 6 L31 8 L43 2" fill="none" stroke="{{gold}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span style="font-size: 12px; font-weight: 600; color: {{ink}}">Cost Control</span>
</div>
<sc-for list="{{particles}}" as="p" hint-placeholder-count="12"><span class="rs-particle" style="left: {{p.x}}; top: {{p.y}}; width: {{p.s}}; height: {{p.s}}; background: {{gold}}; animation-delay: {{p.d}}"></span></sc-for>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
<div style="position: relative">
<h1 class="rs-name" style="margin: 0; padding: 0 8px; font-family: 'Cormorant Garamond', Georgia, serif; font-size: clamp(52px, 7vw, 90px); font-weight: 600; line-height: 1.05; letter-spacing: .01em; background-image: {{shine}}">Rosemary</h1>
<svg aria-hidden="true" width="34" height="34" viewBox="-17 -17 34 34" style="position: absolute; top: -6px; right: -18px; overflow: visible">
<path class="rs-spark" style="animation-delay: 3.3s" d="M0 -16 L2.4 -2.4 L16 0 L2.4 2.4 L0 16 L-2.4 2.4 L-16 0 L-2.4 -2.4 Z" fill="{{sparkle}}"></path>
</svg>
</div>
<p aria-label="Software Solutions" style="margin: 0; font-size: clamp(12px, 1.25vw, 15px); font-weight: 500; letter-spacing: .42em; color: {{goldText}}">
<sc-for list="{{letters}}" as="l" hint-placeholder-count="18"><span class="rs-ch" aria-hidden="true" style="animation-delay: {{l.delay}}">{{l.ch}}</span></sc-for>
</p>
</div>
<div aria-hidden="true" style="display: flex; align-items: center; gap: 12px">
<div class="rs-line rs-line-a" style="width: 110px; height: 1px; background: {{gold}}"></div>
<div class="rs-dia" style="width: 7px; height: 7px; background: {{gold}}"></div>
<div class="rs-line rs-line-b" style="width: 110px; height: 1px; background: {{gold}}"></div>
</div>
<p class="rs-tag" style="margin: 0; font-size: clamp(14px, 1.4vw, 18px); font-weight: 400; letter-spacing: .01em; color: {{muted}}">Integrated software platform to manage your organization</p>
</div>
</sc-if>
<sc-if value="{{showReplay}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{replay}}" style="position: absolute; bottom: 20px; right: 20px; min-height: 44px; padding: 0 18px; border-radius: 22px; border: 1px solid {{gold}}; background: transparent; color: {{goldText}}; font-family: inherit; font-size: 14px; cursor: pointer">Replay</button>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"siteTheme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Display"},"backdrop":{"editor":"enum","options":["none","light","dark"],"default":"none","section":"Display"},"gold":{"editor":"color","default":"#C9A24A","options":["#C9A24A","#D4AF37","#B8893A","#E6C877"],"section":"Colors"},"loop":{"editor":"boolean","default":true,"section":"Preview"},"showReplay":{"editor":"boolean","default":true,"section":"Preview"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { show: true };
  }
  componentDidMount() {
    this.timer = setInterval(() => {
      if (this.props.loop ?? true) this.restart();
    }, 6300);
  }
  componentWillUnmount() {
    clearInterval(this.timer);
    clearTimeout(this.t2);
  }
  restart() {
    this.setState({ show: false });
    clearTimeout(this.t2);
    this.t2 = setTimeout(() => this.setState({ show: true }), 60);
  }
  renderVals() {
    const dark = (this.props.siteTheme ?? 'light') === 'dark';
    const gold = this.props.gold ?? '#C9A24A';
    const ink = dark ? '#F5F1E6' : '#0E3B2E';
    const bd = this.props.backdrop ?? 'none';
    const glow = dark ? 'rgba(255,244,214,.38)' : 'rgba(226,190,104,.42)';
    const letters = 'SOFTWARE SOLUTIONS'.split('').map((c, i) => ({
      ch: c === ' ' ? ' ' : c,
      delay: (2.05 + i * 0.035).toFixed(3) + 's'
    }));
    const pts = [[8,70,4],[15,30,3],[24,85,5],[33,10,3],[46,92,4],[54,4,3],[63,88,5],[72,18,3],[80,76,4],[88,40,3],[94,82,5],[50,50,3]];
    const particles = pts.map((p, i) => ({ x: p[0] + '%', y: p[1] + '%', s: p[2] + 'px', d: (1.5 + (i % 6) * 0.18).toFixed(2) + 's' }));
    return {
      show: this.state.show,
      gold,
      ink,
      green1: dark ? '#5FBF85' : '#1F7A50',
      green2: dark ? 'rgba(95,191,133,.55)' : 'rgba(31,122,80,.38)',
      areaFill: dark ? 'rgba(95,191,133,.16)' : 'rgba(31,122,80,.10)',
      dotRing: dark ? '#0B3327' : '#FFFFFF',
      glassBg: dark ? 'rgba(255,255,255,.07)' : 'rgba(255,255,255,.55)',
      glassBorder: dark ? 'rgba(255,255,255,.16)' : 'rgba(255,255,255,.9)',
      glassShadow: dark ? '0 12px 32px rgba(0,0,0,.25)' : '0 12px 32px rgba(14,59,46,.12), inset 0 1px 0 rgba(255,255,255,.8)',
      gridLine: dark ? 'rgba(255,255,255,.10)' : 'rgba(14,59,46,.08)',
      skeleton: dark ? 'rgba(255,255,255,.14)' : 'rgba(14,59,46,.10)',
      goldText: dark ? '#D9BB6A' : '#8C6A22',
      muted: dark ? '#CFC8B6' : '#3F5249',
      sparkle: dark ? '#FFF4D6' : '#E2B85A',
      beam: 'linear-gradient(90deg, rgba(255,255,255,0) 0%, ' + glow + ' 50%, rgba(255,255,255,0) 100%)',
      shine: 'linear-gradient(100deg, ' + ink + ' 0%, ' + ink + ' 40%, ' + gold + ' 47%, #FFF1C9 50%, ' + gold + ' 53%, ' + ink + ' 60%, ' + ink + ' 100%)',
      backdrop: bd === 'light' ? '#F7F5EF' : bd === 'dark' ? '#0B3327' : 'transparent',
      letters,
      particles,
      showReplay: this.props.showReplay ?? true,
      replay: () => this.restart()
    };
  }
}
</script>
</body>
</html>
